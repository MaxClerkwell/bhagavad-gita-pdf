name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-luatex texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-core fonts-sil-gentiumplus
          fc-cache -f
          fc-list | grep -E 'Gentium Plus|Noto Serif Devanagari'

      - name: Build
        run: make

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: bhagavad-gita-pdf
          path: build/bhagavad-gita.pdf

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bhagavad-gita.pdf
          generate_release_notes: true
